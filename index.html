<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Feliz cumpleaños, Pancha</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="scene">
  <div id="depth-layer">

    <div class="photo" data-index="0" style="--x: -28vw; --y: -14vh; --z: -600; --rot: -4deg;">
      <img src="images/IMG_4694.webp" alt="Pancha con un pañuelo azul y un vestido rojo" />
    </div>

    <div class="photo" data-index="1" style="--x: 26vw; --y: 10vh; --z: -1500; --rot: 3deg;">
      <img src="images/IMG_4696.webp" alt="Pancha" />
    </div>

    <div class="photo" data-index="2" style="--x: -22vw; --y: 16vh; --z: -2400; --rot: 5deg;">
      <img src="images/IMG_4698.webp" alt="Pancha de cerca, con el pelo azul" />
    </div>

    <div class="photo" data-index="3" style="--x: 24vw; --y: -16vh; --z: -3300; --rot: -3deg;">
      <img src="images/IMG_4699.webp" alt="Pancha" />
    </div>

    <div class="photo" data-index="4" style="--x: 0vw; --y: 6vh; --z: -4200; --rot: 2deg;">
      <img src="images/IMG_4700.webp" alt="Pancha" />
    </div>

    <div class="photo" data-index="5" style="--x: -24vw; --y: 10vh; --z: -5100; --rot: -3deg;">
      <img src="images/guestbook-01.webp" alt="Foto del libro de visitas, de sonik" />
    </div>

  </div>

  <div id="intro">
    <p class="eyebrow">[ 7 de noviembre ]</p>
    <h1>Feliz cumple,<br /><em>Pancha</em></h1>
    <p class="hint">scrollea para entrar</p>
  </div>

  <div id="outro">
    <p class="eyebrow">[ con cariño ]</p>
    <h2>Que lo cumplas muy feliz.</h2>
  </div>

  <div id="progress"><div id="progress-dot"></div></div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
